apiVersion: v1
kind: ConfigMap
metadata:
  name: leaderboard-config
  namespace: litellm
  labels:
    app: leaderboard
data:
  PORT: "3000"

  # SQLite file inside the mounted PVC (k8s/app/pvc.yaml).
  DB_PATH: "/data/leaderboard.db"

  # Mount point on the shared grid host. The app strips this prefix itself, so
  # it works whether or not the ingress rewrites the path. Leave empty to serve
  # from the domain root.
  BASE_PATH: "/claude/usage"

  # Monthly cost of one Claude Max plan, in USD — drives the budget maths.
  PLAN_COST: "200"

  # Cloudflare Access is not used in this deployment; auth is Pomerium SSO
  # (dashboard) plus lifetime bearer tokens (extension). Empty disables the
  # worker's JWT check — see src/auth.js:19.
  CF_ACCESS_AUD: ""
  CF_ACCESS_TEAM_DOMAIN: ""
