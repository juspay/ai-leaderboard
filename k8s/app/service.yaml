apiVersion: v1
kind: Service
metadata:
  name: leaderboard
  namespace: litellm
  labels:
    app: leaderboard
spec:
  # ClusterIP, never NodePort: server.js trusts the X-Pomerium-Claim-Email
  # header unconditionally, so anything able to reach this Service directly
  # could impersonate any user. Pomerium must be the only way in.
  type: ClusterIP
  selector:
    app: leaderboard
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
