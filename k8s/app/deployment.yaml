# InfraSwitch owns this resource — it is NOT applied with kubectl.
# Kept here as the spec InfraSwitch must reproduce, and to keep the settings
# under review in git. Two of them are correctness constraints, not preferences:
# replicas must stay 1 and the strategy must be Recreate, because SQLite on a
# ReadWriteOnce disk tolerates exactly one writer. An HPA that can scale past 1
# will either wedge on a Multi-Attach error or corrupt the database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-leaderboard
  namespace: litellm
  labels:
    app: claude-leaderboard
spec:
  replicas: 1
  # Recreate, NOT RollingUpdate. The PVC is ReadWriteOnce and SQLite tolerates
  # exactly one writer. A rolling update would start the new pod before the old
  # one terminates, and the two would fight over the same volume — either a
  # multi-attach error, or two processes writing one database file.
  # Cost: a few seconds of downtime per deploy. Accepted deliberately.
  strategy:
    type: Recreate
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: claude-leaderboard
  template:
    metadata:
      labels:
        app: claude-leaderboard
    spec:
      securityContext:
        # node:20-slim's built-in `node` user. fsGroup makes the mounted volume
        # group-writable so the non-root process can create the database file.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: claude-leaderboard
          image: gcr.io/xyne-dev-461113/ai-leaderboard:latest # overwritten per deploy with the commit SHA
          imagePullPolicy: Always
          ports:
            - containerPort: 8420
              name: http
              protocol: TCP
          # Every value comes from app-config. InfraSwitch owns this
          # Deployment, so literals written here would not survive a
          # platform-driven redeploy — the ConfigMap is the only durable lever.
          #
          # Named keys rather than envFrom: app-config is shared with grid and
          # every other LITELLM product, so envFrom would inject ~32 unrelated
          # variables into this container.
          env:
            - name: CLAUDE_DB_PATH
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CLAUDE_DB_PATH
            - name: CLAUDE_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CLAUDE_BASE_PATH
            - name: CLAUDE_PLAN_COST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CLAUDE_PLAN_COST
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/data
              port: 8420
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/data
              port: 8420
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: leaderboard-data
      terminationGracePeriodSeconds: 30
